spring:
  application:
    name: smart-notes-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_notes_db
    username: notes_user
    password: notes123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-1.5-flash