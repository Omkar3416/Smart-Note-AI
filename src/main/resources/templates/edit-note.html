<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Edit Note</title>
</head>

<body>

<h1>Edit Note</h1>

<form th:action="@{/notes/update/{id}(id=${note.id})}"
      method="post">

  <div>

    <label>Title</label>

    <input
            type="text"
            name="title"
            th:value="${note.title}">
  </div>

  <br>

  <div>

    <label>Content</label>

    <textarea
            name="content"
            rows="5"
            cols="40"
            th:text="${note.content}">
        </textarea>

  </div>

  <br>

  <button type="submit">

    Update Note

  </button>

</form>

<br>

<a href="/notes">

  Back To Notes

</a>

</body>

</html>
